<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="style.css">
  <title>Only Grid Website</title>
</head>
<body>

  <div class="gridlayout">
    
    <header class="navbar">
      <div class="logo">RentGhar</div>
      <nav class="nav-links">
        <a href="#">Home</a>
        <a href="#">Houses</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <section class="herosection">
      <div>
        <h1>Find Your Next Home</h1>
        <p>Affordable houses & flats in Pakistan</p>
      </div>
    </section>

    <aside class="slidebarfilters">
      <h2>Filters</h2>
      
      <div class="slidebargroup">
        <label>City</label>
        <select>
          <option>Karachi</option>
          <option>Lahore</option>
          <option>Islamabad</option>
        </select>
      </div>

      <div class="slidebargroup">
        <label>Price</label>
        <select>
          <option>30k - 80k</option>
          <option>80k - 150k</option>
          <option>150k+</option>
        </select>
      </div>

      <div class="slidebargroup">
        <label>Property Type</label>
        <div class="radio-group">
          <label class="radio-item"><input type="radio" name="type" checked> House</label>
          <label class="radio-item"><input type="radio" name="type"> Flat</label>
          <label class="radio-item"><input type="radio" name="type"> Portion</label>
        </div>
      </div>
    </aside>

    <main class="listingssection">
      <h2>Property Listings</h2>
      
      <div class="cards-grid">
        <div class="card">
          <div class="icon">🏠</div>
          <div class="title">House 1</div>
        </div>
        <div class="card">
          <div class="icon">🏠</div>
          <div class="title">House 2</div>
        </div>
        <div class="card">
          <div class="icon">🏠</div>
          <div class="title">House 3</div>
        </div>
        <div class="card">
          <div class="icon">🏠</div>
          <div class="title">House 4</div>
        </div>
        <div class="card">
          <div class="icon">🏠</div>
          <div class="title">House 5</div>
        </div>
        <div class="card">
          <div class="icon">🏠</div>
          <div class="title">House 6</div>
        </div>
      </div>
    </main>

  </div>

<footer class="footer">
      <p>&copy; 2026 RentGhar. All rights reserved.</p>
    </footer>>


</body>
</html>
